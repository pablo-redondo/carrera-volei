<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070a10">
<title>Carrera de Vóley — Simulador</title>
<link rel="preload" href="fonts/Inter-400800-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/BarlowCondensed-700-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fuentes.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Biblioteca de gráficos SVG reutilizables (balón, pista, silueta de remate) -->
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="gradAcento" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ff6b1a"/>
        <stop offset="100%" stop-color="#ffb347"/>
      </linearGradient>
      <linearGradient id="gradFrio" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#22d3ee"/>
        <stop offset="100%" stop-color="#4f7cff"/>
      </linearGradient>

      <!-- Balón de voleibol: cuero claro, costuras oscuras y panel naranja -->
      <radialGradient id="gradCuero" cx="34%" cy="28%" r="78%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="62%" stop-color="#e7eef7"/>
        <stop offset="100%" stop-color="#aebccd"/>
      </radialGradient>
      <symbol id="ico-balon" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="46" fill="url(#gradCuero)"/>
        <!-- panel de color que da carácter deportivo -->
        <path d="M66 96C60 70 66 40 90 20a46 46 0 0 1-24 76z" fill="url(#gradAcento)" opacity=".92"/>
        <!-- costuras: las tres curvas clásicas del voleibol -->
        <g fill="none" stroke="#101822" stroke-width="3.6" stroke-linecap="round" opacity=".92">
          <path d="M50 4C29 23 20 49 25 79"/>
          <path d="M95 43C73 39 45 46 23 67"/>
          <path d="M66 96C60 70 66 40 90 20"/>
        </g>
        <circle cx="50" cy="50" r="46" fill="none" stroke="rgba(9,13,19,.35)" stroke-width="2.5"/>
      </symbol>

      <!-- Silueta de jugador rematando -->
      <symbol id="ico-remate" viewBox="0 0 160 160">
        <g fill="currentColor">
          <circle cx="96" cy="34" r="12"/>
          <path d="M92 48c10-3 20 2 23 12l7 24c1 5-2 10-7 11s-10-2-11-7l-4-14-6 20 16 22c3 4 2 10-2 13s-10 2-13-2l-20-27c-2-3-3-7-2-11l4-16-14 10-14 20c-3 4-9 5-13 2s-5-9-2-13l16-23c1-2 3-4 5-5l24-13c4-2 8-3 13-3z"/>
          <path d="M104 44c4-8 12-16 22-20 4-2 8 0 9 4s0 8-4 9c-7 3-13 8-16 14z"/>
        </g>
      </symbol>

      <!-- Trofeo -->
      <symbol id="ico-trofeo" viewBox="0 0 100 100">
        <g fill="currentColor">
          <path d="M28 14h44v26a22 22 0 0 1-44 0z"/>
          <path d="M24 20H12v10a18 18 0 0 0 16 18v-9a10 10 0 0 1-6-9zM76 20h12v10a18 18 0 0 1-16 18v-9a10 10 0 0 0 6-9z"/>
          <rect x="42" y="60" width="16" height="16" rx="3"/>
          <rect x="28" y="76" width="44" height="10" rx="4"/>
        </g>
      </symbol>

      <!-- ============ Iconografía de la interfaz ============
           Trazo limpio sobre rejilla de 24, en lugar de emojis: los emojis
           cambian de forma en cada sistema operativo y dan aspecto de
           maqueta sin acabar. -->
      <g id="set-iconos">
        <symbol id="i-ataque" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 4.5 13.5 13"/><path d="M13.5 13V8"/><path d="M13.5 13h-5"/>
            <path d="M3 19.5h18"/><path d="M17.5 16.5v6"/>
          </g>
        </symbol>
        <symbol id="i-bloqueo" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.5 9.5h19"/>
            <path d="M7 21v-7.5a2 2 0 0 1 4 0V21"/>
            <path d="M13 21v-9a2 2 0 0 1 4 0v9"/>
          </g>
        </symbol>
        <symbol id="i-saque" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="6.5" cy="17.5" r="3.5"/>
            <path d="M9.5 15.2C12 7 17 4.5 21 6.5"/>
            <path d="M21 6.5 17.6 7.2"/><path d="M21 6.5l-.8 3.4"/>
          </g>
        </symbol>
        <symbol id="i-recepcion" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="5.5" r="3"/>
            <path d="M3.5 19 12 14.2 20.5 19"/>
            <path d="M3.5 19v2.2M20.5 19v2.2"/>
          </g>
        </symbol>
        <symbol id="i-colocacion" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="6.5" r="3.5"/>
            <path d="M6 21v-4.2l3.2-2.3"/><path d="M18 21v-4.2l-3.2-2.3"/>
            <path d="M8.6 11.4 6 9.2M15.4 11.4 18 9.2"/>
          </g>
        </symbol>
        <symbol id="i-defensa" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2.6 20 5.6v6.1c0 4.9-3.4 8.2-8 9.7-4.6-1.5-8-4.8-8-9.7V5.6z"/>
            <path d="M8.8 11.8 11.2 14.2 15.6 9.8"/>
          </g>
        </symbol>
        <symbol id="i-fisico" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13.4 2 5 13.4h5.6L9.8 22l8.6-11.6h-5.6z"/>
          </g>
        </symbol>
        <symbol id="i-liderazgo" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2.8l2.8 6 6.4.7-4.8 4.4 1.3 6.3L12 17l-5.7 3.2 1.3-6.3-4.8-4.4 6.4-.7z"/>
          </g>
        </symbol>

        <symbol id="i-moral" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20.6s-7.4-4.6-7.4-9.6A4.2 4.2 0 0 1 12 8.6a4.2 4.2 0 0 1 7.4 2.4c0 5-7.4 9.6-7.4 9.6z"/>
          </g>
        </symbol>
        <symbol id="i-dinero" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9.2"/>
            <path d="M15.6 8.4a4.2 4.2 0 0 0-5.9 1.2 5 5 0 0 0 0 4.8 4.2 4.2 0 0 0 5.9 1.2"/>
            <path d="M7.6 10.8h5.2M7.6 13.6h5.2"/>
          </g>
        </symbol>
        <symbol id="i-reputacion" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 10v4h3.2L13 18.5v-13L6.2 10z"/>
            <path d="M16.6 9.2a4.4 4.4 0 0 1 0 5.6"/>
            <path d="M19.2 6.6a8 8 0 0 1 0 10.8"/>
          </g>
        </symbol>
        <symbol id="i-lesion" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.8" y="8.4" width="18.4" height="7.2" rx="3.6"/>
            <path d="M12 10.6v2.8M10.6 12h2.8"/>
          </g>
        </symbol>
        <symbol id="i-titulo" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 3.4h10v5.2a5 5 0 0 1-10 0z"/>
            <path d="M7 5.2H4.2v1.6a3.6 3.6 0 0 0 2.9 3.5M17 5.2h2.8v1.6a3.6 3.6 0 0 1-2.9 3.5"/>
            <path d="M12 13.6v3.2M8.4 20.6h7.2"/>
          </g>
        </symbol>
        <symbol id="i-seleccion" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9.2"/>
            <path d="M2.8 12h18.4"/>
            <path d="M12 2.8a13.6 13.6 0 0 1 0 18.4 13.6 13.6 0 0 1 0-18.4z"/>
          </g>
        </symbol>
        <symbol id="i-partido" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.6" y="5.4" width="18.8" height="13.2" rx="1.8"/>
            <path d="M12 5.4v13.2"/><circle cx="12" cy="12" r="2.6"/>
          </g>
        </symbol>
        <symbol id="i-descanso" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.4 14.2A8.6 8.6 0 0 1 9.8 3.6a8.6 8.6 0 1 0 10.6 10.6z"/>
          </g>
        </symbol>
        <symbol id="i-logro" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="14.4" r="6.2"/>
            <path d="M8.6 8.8 6.2 2.8h11.6l-2.4 6"/>
            <path d="m12 11.6 1.2 2.5 2.7.4-2 1.9.5 2.7-2.4-1.3-2.4 1.3.5-2.7-2-1.9 2.7-.4z"/>
          </g>
        </symbol>
        <symbol id="i-buscar" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
            <circle cx="10.8" cy="10.8" r="6.6"/><path d="m15.6 15.6 4.4 4.4"/>
          </g>
        </symbol>
        <symbol id="i-candado" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4.4" y="10.4" width="15.2" height="10.4" rx="2.4"/>
            <path d="M8 10.4V7.6a4 4 0 0 1 8 0v2.8"/>
          </g>
        </symbol>
        <symbol id="i-flecha-arriba" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19.5v-15"/><path d="M5.5 11 12 4.5 18.5 11"/>
          </g>
        </symbol>
        <symbol id="i-flecha-abajo" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 4.5v15"/><path d="M5.5 13 12 19.5 18.5 13"/>
          </g>
        </symbol>
      </g>
    </defs>
  </svg>

  <div id="app">
    <div class="fondo-pista" aria-hidden="true"></div>

    <header class="cabecera">
      <div class="marca">
        <svg class="marca-balon" viewBox="0 0 100 100" aria-hidden="true"><use href="#ico-balon"/></svg>
        <span class="marca-texto">Carrera de <b>Vóley</b></span>
      </div>
      <div class="cabecera-derecha">
        <button type="button" id="btn-logros" class="btn-logros" aria-label="Ver logros">
          <span aria-hidden="true">🏅</span><span class="btn-logros-txt">Logros</span>
        </button>
        <div id="cabecera-overall" class="cabecera-overall"></div>
        <div id="cabecera-temporada" class="cabecera-temporada"></div>
      </div>
    </header>

    <!-- Dos columnas fijas: a la izquierda la ficha del jugador y la decisión
         del momento; a la derecha la trayectoria completa por edades, que se
         mantiene siempre visible y llena la altura de la pantalla. -->
    <main class="contenido">
      <section class="columna-juego">
        <div id="ficha" class="ficha oculto"></div>
        <section id="pantalla" class="pantalla"></section>
      </section>
      <aside id="trayectoria" class="trayectoria oculto"></aside>
    </main>

    <footer class="pie">
      <span>Simulador de carrera de voleibol — historia ficticia generada por tus decisiones y el azar.</span>
    </footer>
  </div>

  <!-- Modal de logros: vive fuera de #pantalla para poder abrirse desde
       cualquier punto del juego sin tocar el estado de la partida. -->
  <div id="modal-logros" class="modal-logros oculto" role="dialog" aria-modal="true" aria-label="Logros">
    <div class="modal-logros-caja">
      <div class="modal-logros-cabecera">
        <div>
          <span class="eyebrow">Progreso</span>
          <h2>Logros</h2>
        </div>
        <button type="button" id="cerrar-logros" class="cerrar-logros" aria-label="Cerrar logros">✕</button>
      </div>
      <div id="logros-contenido" class="modal-logros-cuerpo"></div>
    </div>
  </div>

  <!-- Avisos de logro conseguido, apilados en una esquina -->
  <div id="logros-toast" class="logros-toast-cont" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
